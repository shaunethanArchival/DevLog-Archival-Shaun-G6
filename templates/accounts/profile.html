{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Profile</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div>
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="errorlist">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Save Changes</button>
    </form>
</div>
{% endblock %}
