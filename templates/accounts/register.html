{% extends 'base.html' %}

{% block content %}
<div class="card auth-box">
    <h2>Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div>
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="errorlist">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Create Account</button>
    </form>
    <p>Already registered? <a href="{% url 'accounts:login' %}">Login here</a>.</p>
</div>
{% endblock %}
